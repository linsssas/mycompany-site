<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель мастера — NAILBLAACK</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💅</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">NAIL<span>BLAACK</span></a>
    <nav class="nav">
      <a href="index.html">← На сайт</a>
    </nav>
  </div>
</header>

<div class="admin-login" id="adminLogin">
  <form class="admin-login-card" id="adminLoginForm">
    <h2>Панель мастера</h2>
    <p>Введите пароль для доступа</p>
    <input type="password" id="adminPasswordInput" placeholder="Пароль" autocomplete="current-password">
    <button type="submit" class="btn btn-primary">Войти</button>
    <p class="admin-login-error" id="adminLoginError" hidden>Неверный пароль</p>
  </form>
</div>

<main class="section admin-main" id="adminMain" hidden>
  <div class="container">
    <h1 class="section-title" style="text-align:left">Панель записей</h1>
    <p class="section-sub" style="margin:0 0 24px;text-align:left">
      Здесь бот сохраняет все записи, сделанные через чат на сайте. Данные хранятся локально в этом браузере.
    </p>

    <div class="admin-toolbar">
      <label>Мастер:
        <select id="filterMaster">
          <option value="all">Все мастера</option>
        </select>
      </label>
      <label>Статус:
        <select id="filterStatus">
          <option value="all">Все</option>
          <option value="confirmed">Подтверждена</option>
          <option value="cancelled">Отменена</option>
        </select>
      </label>
      <button class="btn btn-outline" id="refreshBtn">Обновить</button>
    </div>

    <div id="mastersSummary" class="admin-summary"></div>

    <div class="table-wrap">
      <table class="admin-table" id="bookingsTable">
        <thead>
          <tr>
            <th>Дата / время</th>
            <th>Мастер</th>
            <th>Услуга</th>
            <th>Клиент</th>
            <th>Телефон</th>
            <th>Статус</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
      </table>
      <p id="emptyState" class="empty-state" hidden>Пока нет ни одной записи.</p>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
